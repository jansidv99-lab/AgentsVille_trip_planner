displayName: AgentsVille A6 – Unhappy users (👎 > 50%)
severity: WARNING
combiner: OR
conditions:
- displayName: AgentsVille A6 – Unhappy users (👎 > 50%) – condition
  conditionPrometheusQueryLanguage:
    query: (sum(increase(logging_googleapis_com:user_agentsville_feedback{monitored_resource="cloud_run_revision",service_name="agentsville-trip-planner",rating="down"}[24h])) / sum(increase(logging_googleapis_com:user_agentsville_feedback{monitored_resource="cloud_run_revision",service_name="agentsville-trip-planner"}[24h])))
      > 0.5 and sum(increase(logging_googleapis_com:user_agentsville_feedback{monitored_resource="cloud_run_revision",service_name="agentsville-trip-planner"}[24h])) >= 5
    duration: 0s
    evaluationInterval: 60s
alertStrategy:
  autoClose: 3600s
documentation:
  content: '## AgentsVille A6 – Unhappy users (👎 > 50%)


    **What it means:** More than half of user ratings were 👎 in 24 h (at least 5 ratings).


    **First steps:**

    1. Read the comments: `SELECT comment FROM runs_with_feedback WHERE rating = ''down''`.

    2. Run `python -m evals.harness.promote mine` and review the candidates for the golden dataset.


    Dashboard: *AgentsVille – AI quality & ops* · BigQuery: `agentsville_observability.runs_with_feedback` / `daily_quality`


    _Defined in `deploy/monitoring/alerts/a6-unhappy-users.yaml` (Phase 7 – C3)._'
  mimeType: text/markdown
userLabels:
  app: agentsville
  layer: c3
