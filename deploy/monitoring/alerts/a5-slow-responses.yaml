displayName: AgentsVille A5 – Slow responses (p95 > 60 s)
severity: WARNING
combiner: OR
conditions:
- displayName: AgentsVille A5 – Slow responses (p95 > 60 s) – condition
  conditionPrometheusQueryLanguage:
    query: histogram_quantile(0.95, sum by (le) (rate(logging_googleapis_com:user_agentsville_llm_latency_ms_bucket{monitored_resource="cloud_run_revision",service_name="agentsville-trip-planner"}[30m])))
      > 60000
    duration: 0s
    evaluationInterval: 60s
alertStrategy:
  autoClose: 3600s
documentation:
  content: '## AgentsVille A5 – Slow responses (p95 > 60 s)


    **What it means:** The 95th-percentile LLM latency is above 60 s over 30 min. Normal p95 ≈ 31–42 s.


    **First steps:**

    1. Check the provider''s status and the `latency_ms` trend by prompt version on the dashboard.

    2. Long trips (6 days) are slowest; check `input_profile` for a shift to longer trips.


    Dashboard: *AgentsVille – AI quality & ops* · BigQuery: `agentsville_observability.runs_with_feedback` / `daily_quality`


    _Defined in `deploy/monitoring/alerts/a5-slow-responses.yaml` (Phase 7 – C3)._'
  mimeType: text/markdown
userLabels:
  app: agentsville
  layer: c3
