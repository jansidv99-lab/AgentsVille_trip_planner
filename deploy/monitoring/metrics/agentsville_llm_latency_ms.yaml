name: agentsville_llm_latency_ms
description: '[Phase 7 – C2] LLM call latency per generated itinerary'
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="agentsville-trip-planner"
  AND jsonPayload.app="agentsville" AND jsonPayload.event="llm_run" AND jsonPayload.latency_ms>0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
  - key: prompt_version
    valueType: STRING
labelExtractors:
  prompt_version: EXTRACT(jsonPayload.prompt_version)
valueExtractor: EXTRACT(jsonPayload.latency_ms)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 30
    growthFactor: 1.4
    scale: 100
