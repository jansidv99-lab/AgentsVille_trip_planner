name: agentsville_llm_tokens
description: '[Phase 7 – C2] Completion tokens per generated itinerary'
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="agentsville-trip-planner"
  AND jsonPayload.app="agentsville" AND jsonPayload.event="llm_run" AND jsonPayload.completion_tokens>0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: '1'
  labels:
  - key: prompt_version
    valueType: STRING
labelExtractors:
  prompt_version: EXTRACT(jsonPayload.prompt_version)
valueExtractor: EXTRACT(jsonPayload.completion_tokens)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 30
    growthFactor: 1.4
    scale: 50
