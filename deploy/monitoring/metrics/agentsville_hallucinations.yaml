name: agentsville_hallucinations
description: '[Phase 7 – C2] Runs with a fabricated or altered fact (any B1 hard grader
  failed) – must stay 0'
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="agentsville-trip-planner"
  AND jsonPayload.app="agentsville" AND jsonPayload.event="llm_run" AND jsonPayload.hallucination=true
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: '1'
  labels:
  - key: prompt_version
    valueType: STRING
labelExtractors:
  prompt_version: EXTRACT(jsonPayload.prompt_version)
