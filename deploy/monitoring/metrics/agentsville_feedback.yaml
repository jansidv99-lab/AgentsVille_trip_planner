name: agentsville_feedback
description: '[Phase 7 – C2] User feedback events (rating up/down)'
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="agentsville-trip-planner"
  AND jsonPayload.app="agentsville" AND jsonPayload.event="feedback"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: '1'
  labels:
  - key: rating
    valueType: STRING
labelExtractors:
  rating: EXTRACT(jsonPayload.rating)
