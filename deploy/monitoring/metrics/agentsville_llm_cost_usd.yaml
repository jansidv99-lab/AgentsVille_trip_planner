name: agentsville_llm_cost_usd
description: '[Phase 7 – C2] Estimated LLM cost per generated itinerary'
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="agentsville-trip-planner"
  AND jsonPayload.app="agentsville" AND jsonPayload.event="llm_run" AND jsonPayload.cost_usd>0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: USD
  labels:
  - key: prompt_version
    valueType: STRING
labelExtractors:
  prompt_version: EXTRACT(jsonPayload.prompt_version)
valueExtractor: EXTRACT(jsonPayload.cost_usd)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 30
    growthFactor: 1.4
    scale: 0.0001
