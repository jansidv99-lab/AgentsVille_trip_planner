# Phase 5 – B4 Step 5: manual full eval (8 cases × repeats, optional LLM judge). Costs ≈ 24–50 calls,
# so it only runs on demand (Actions → "Evals (full)" → Run workflow). Report + records are uploaded.

name: Evals (full)

on:
  workflow_dispatch:
    inputs:
      prompt_version:
        description: "Prompt version to evaluate (e.g. v1, v2)"
        required: true
        default: "v2"
      compare_to:
        description: "Baseline prompt version to compare against"
        required: true
        default: "v1"
      repeats:
        description: "Repeats per case"
        required: true
        default: "3"
      judge:
        description: "Also run the offline LLM judge (≈ +24 calls)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full-eval:
    name: Full eval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run full eval
        run: |
          python -m evals.harness.runner --mode full --model gpt-4.1-mini \
            --repeats "${{ inputs.repeats }}" \
            --prompt-version "${{ inputs.prompt_version }}" \
            --compare-to "${{ inputs.compare_to }}" \
            ${{ inputs.judge && '--judge' || '' }}
          cat evals/results/*/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-report
          path: evals/results/
