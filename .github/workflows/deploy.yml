# Phase 6 – Step 4: CD – every push to main (i.e. every merged PR) is tested again,
# built into an image tagged with the commit SHA, deployed to Cloud Run, and smoke-tested.
#
# Authentication uses Workload Identity Federation: GitHub's short-lived OIDC token is exchanged
# for temporary credentials of the deployer service account. No JSON key exists anywhere.
# The WIF provider only trusts this repo on refs/heads/main, so other branches can't deploy.
#
# Repository variables (set by deploy/gcp-setup.sh): GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER,
# DEPLOYER_SA, RUNTIME_SA, OPENAI_BASE_URL, MODEL, PROMPT_VERSION.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue them instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE: agentsville-trip-planner
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agentsville/trip-planner

jobs:
  # Phase 6 – Step 4: re-run Layer A on the merged code before anything ships
  gate:
    name: Deploy gate – Layer A tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # Phase 6 – Step 4: build → push → deploy → smoke test
  deploy:
    name: Build and deploy to Cloud Run
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # lets the job request GitHub's OIDC token for WIF
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image (tagged with the commit SHA)
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --service-account "${{ vars.RUNTIME_SA }}" \
            --set-secrets "OPENAI_API_KEY=agentsville-openai-api-key:latest" \
            --set-env-vars "OPENAI_BASE_URL=${{ vars.OPENAI_BASE_URL }},MODEL=${{ vars.MODEL }},PROMPT_VERSION=${{ vars.PROMPT_VERSION }}" \
            --allow-unauthenticated \
            --session-affinity \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 300 \
            --labels "app=agentsville,commit=${GITHUB_SHA::7}" \
            --quiet
          url=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live service
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 12); do
            if curl -fsS "${url}/_stcore/health" | grep -q ok; then
              echo "Live service is healthy: ${url}"; exit 0
            fi
            sleep 5
          done
          echo "Health check failed for ${url}"; exit 1

      - name: Job summary
        run: |
          {
            echo "### 🚀 Deployed AgentsVille Trip Planner"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            echo "- **Image:** \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- **Commit:** ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
