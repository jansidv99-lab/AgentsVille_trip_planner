# Phase 4 – Step 1: pytest configuration for Layer A (deterministic tests)
[pytest]
# Where tests live, and make the project root importable (models, llm, agents, ...).
testpaths = tests evals
pythonpath = .

# Layer B evals call the LLM and cost money, so they're excluded by default.
# Run them explicitly with:  pytest -m eval   (the last -m wins)
addopts = -m "not eval"

markers =
    eval: Layer B probabilistic evals (call the LLM, cost money)
